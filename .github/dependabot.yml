version: 2
updates:
  # npm dependency updates for this package
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    reviewers:
      - "Quantum-L9/platform"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:deps"
      - "automation:dependabot"
    open-pull-requests-limit: 10

  # SHA-pin / version maintenance for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    reviewers:
      - "Quantum-L9/platform"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "type:deps"
      - "area:workflows"
      - "automation:dependabot"
    open-pull-requests-limit: 5
