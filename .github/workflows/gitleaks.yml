# L9 Secret Scanning — SEO-Bot
#
# Local secret scan (gitleaks) on PRs and pushes to main. Recommended to be
# promoted to a required check once stable (see
# .github/governance/branch-protection-baseline.yaml).
name: Gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for org accounts; unset is fine for
          # public repos and single scans. Config is read from .gitleaks.toml.
          GITLEAKS_CONFIG: .gitleaks.toml
