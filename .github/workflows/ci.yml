name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@quantum-l9'

      # package-lock.json is committed, so use `npm ci` for a reproducible,
      # version-locked install. `--ignore-scripts` blocks dependency lifecycle
      # scripts (the project defines none). NODE_AUTH_TOKEN + the @quantum-l9
      # registry scope let the install pull @quantum-l9/llm-router from GitHub
      # Packages; the job stays red until that package is granted read access.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Typecheck is a BLOCKING gate: the pre-existing type debt (drizzle inserts,
      # bullmq v5 / ioredis typings, ContentStrategyConfig) was cleared, so tsc
      # must stay at 0.
      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit

      # JS/TS/JSON lint+format is the Biome job in l9-lint-test.yml
      # (advisory until enforce-biome: true). Do not run ESLint here — it is a
      # second owner scheduled for removal. See docs/runbooks/BIOME_INSTANTIATION.md.
      - name: Lint owner
        run: |
          echo "Lint/format owner is Biome via l9-lint-test.yml (enforce-biome: false until the tree is clean)."

      # Hard gate: the unit tests (register route + v2 contract schema).
      - name: Test
        run: node_modules/.bin/vitest run
        env:
          NODE_ENV: test
