# Resolves every declared dependency at the range in package.json / the lockfile.
# Do not hardcode @quantum-l9 versions here — a stale pin reports green while
# npm ci fails on an unpublished bump (SEO-Bot#74).
name: Memory stack dependency gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  dependency-resolvable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - name: Require declared dependencies to resolve
        run: npm ci --ignore-scripts --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
