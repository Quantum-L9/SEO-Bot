# SonarQube Cloud automatic-analysis configuration.
#
# This repository is analyzed by automatic analysis (no CI scanner step), which
# reads THIS file and ignores sonar-project.properties. Settings here override
# the equivalents in Administration > General Settings > Analysis Scope.
#
# Two exclusions, each because the finding cannot be acted on where it is
# reported — not because the rule is inconvenient.
#
# **/*.sql — wrong dialect. SonarQube Cloud analyzes these with the Oracle
#   PL/SQL analyzer (every finding carries a `plsql:` rule key), and this
#   repository is PostgreSQL only: the migrations use `jsonb`, `::jsonb` casts
#   and `gen_random_uuid()`, and scripts/reporting/provision-roles.sql opens
#   with the psql meta-command `\set ON_ERROR_STOP on`, which is not PL/SQL at
#   all. The findings follow from that mismatch rather than from the code —
#   S125 fires on line 30 of provision-roles.sql, an English sentence in a
#   comment block that happens to quote `SELECT * FROM clients`, and S1192 asks
#   for a "constant" to hold '5000ms' in a psql script that has no such
#   construct. No genuine PostgreSQL defect is being suppressed here, because
#   an Oracle analyzer cannot report one.
#
#   drizzle/*.sql is independently untouchable: drizzle/CHECKSUMS.json is an
#   explicit immutability ledger and tests/migrations/static-gates.test.ts fails
#   when an applied migration changes, because a migration that has already run
#   against a deployed database is history — editing it leaves that database
#   diverged from the file claiming to describe it. Rewriting a SELECT * there
#   to satisfy a rule would break that gate and change nothing about any
#   database that already ran it.
#
#   The schema and the query layer that DO get maintained live in
#   src/core/database/ and src/reporting/, both in scope, analyzed as
#   TypeScript.
#
# client-snippets/posthog-tracking.html — the vendor loader. All nine findings
#   sit on one minified line copied verbatim from PostHog's install
#   instructions; the comma operators and inline assignments are the minifier's
#   output, not authored style. Reformatting it would fork a third-party
#   snippet we need to be able to re-paste on their next version. The
#   initialization below it that we do own is not excluded.
#
# Everything else — src/, scripts/, packages/, tests/, .github/ — is in scope
# and stays in scope. This file is not a place to park findings in code we
# maintain.

sonar.exclusions=**/*.sql, client-snippets/posthog-tracking.html
