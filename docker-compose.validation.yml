services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: l9bot
      POSTGRES_PASSWORD: validation-only
      POSTGRES_DB: l9_seo_bot_validation
    ports:
      # Loopback only, same reasoning as docker-compose.yml: this password is a
      # literal in a tracked file. Non-default host port so starting the gate-5
      # services does not shadow a developer's real Postgres on 5432.
      # The DATABASE_URL to export is in docs/seo-sql/TESTING.md; it is not
      # repeated here, because restating the password above in a second place
      # is a second place to find it.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l9bot -d l9_seo_bot_validation"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      # Loopback only — Redis has no auth configured here. Non-default host
      # port for the same reason as Postgres above.
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
